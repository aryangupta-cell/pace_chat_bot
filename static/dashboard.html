<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PACE Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #dashboardFrame { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; }

  /* Collapsed bubble (~15% larger than the original 60x60 / 28px icon) */
  #chatBubble {
    position: fixed; bottom: 24px; right: 24px; width: 69px; height: 69px;
    border-radius: 50%; background: #0a58ca; color: white; border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; z-index: 1000; transition: transform 0.15s ease;
  }
  #chatBubble:hover { transform: scale(1.06); }

  /* Expanded panel (~10% wider / ~30% taller than the original 380x560) */
  #chatPanel {
    position: fixed; bottom: 24px; right: 24px; width: 502px; height: 728px;
    max-height: 85vh; max-width: 90vw; background: white; border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.3); z-index: 1000;
    display: flex; flex-direction: column; overflow: hidden;
    transform-origin: bottom right;
    transform: scale(0.9); opacity: 0; pointer-events: none;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  #chatPanel.open { transform: scale(1); opacity: 1; pointer-events: auto; }

  #chatHeader {
    background: #0a58ca; color: white; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; flex-shrink: 0;
  }
  #chatHeader button {
    background: none; border: none; color: white; font-size: 18px;
    cursor: pointer; line-height: 1;
  }

  #chat { flex: 1; overflow-y: auto; padding: 12px; background: #f8f9fb; }
  .msg { margin: 8px 0; white-space: pre-wrap; line-height: 1.4; font-size: 14px; }
  .user { text-align: right; }
  .bot { text-align: left; }
  .bot .bubble { background: #eef1f5; display: inline-block; padding: 8px 12px; border-radius: 8px; max-width: 90%; text-align: left; }
  .user .bubble { background: #0a58ca; color: white; display: inline-block; padding: 8px 12px; border-radius: 8px; max-width: 90%; }

  #inputRow { display: flex; padding: 10px; gap: 8px; border-top: 1px solid #e5e5e5; flex-shrink: 0; }
  #msgInput { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
  #sendBtn { padding: 8px 14px; border: none; border-radius: 6px; background: #0a58ca; color: white; cursor: pointer; }
  #sendBtn:hover { background: #084298; }
</style>
</head>
<body>

<iframe id="dashboardFrame"
  src="https://datastudio.google.com/embed/reporting/3e8589a9-dfa7-4f9b-ac5f-e1460740ea8b/page/p_8yt0aopt5d"
  frameborder="0" allowfullscreen></iframe>

<button id="chatBubble" title="Open chat">💬</button>

<div id="chatPanel">
  <div id="chatHeader">
    <span>PACE Chatbot</span>
    <button id="closeBtn" title="Close">✕</button>
  </div>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="msgInput" type="text" placeholder="Ask about attendance or productivity..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="/static/chat-widget.js"></script>
<script>
const bubble = document.getElementById('chatBubble');
const panel = document.getElementById('chatPanel');
const closeBtn = document.getElementById('closeBtn');

let widgetInitialized = false;

function openPanel() {
  panel.classList.add('open');
  bubble.style.display = 'none';
  if (!widgetInitialized) {
    initChatWidget({
      chatEl: document.getElementById('chat'),
      inputEl: document.getElementById('msgInput'),
      sendBtnEl: document.getElementById('sendBtn'),
    });
    widgetInitialized = true;
  }
  document.getElementById('msgInput').focus();
}

function closePanel() {
  panel.classList.remove('open');
  bubble.style.display = 'flex';
}

bubble.addEventListener('click', openPanel);
closeBtn.addEventListener('click', closePanel);
</script>
</body>
</html>
